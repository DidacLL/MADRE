[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "madre-runtime"
version = "0.1.0"
description = "Local-first governed execution and agent interoperability platform"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
dependencies = [
  "fastapi>=0.115,<1",
  "filelock>=3.18,<4",
  "httpx>=0.28,<1",
  "platformdirs>=4,<5",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
madre = "madre.cli:main"

[dependency-groups]
dev = ["hatchling==1.32.0", "mypy>=1.15,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/madre"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/madre"]

[tool.uv]
required-version = "==0.12.10"
