data_dir = ".madre-data"
host = "127.0.0.1"
port = 8731

[[capabilities]]

[capabilities.definition.identity]
kind = "capability"
owner = "installation"
name = "local-chat"
revision = "1"

[capabilities.definition.properties]
boundary = "local"
latency = "interactive"
heavyweight = true

[capabilities.definition.properties.specialization]
kind = "specialization"
owner = "madre.execution"
name = "language-inference"
revision = "1"

[capabilities.definition.properties.modality]
kind = "modality"
owner = "madre.execution"
name = "structured-text"
revision = "1"

[[capabilities.definition.security.scopes]]

# This is an explicit fact about the actual observer boundary.
# The local endpoint does not imply this value.
privacy = 4

[capabilities.definition.security.scopes.identity]
kind = "capability"
owner = "installation"
name = "local-chat"
revision = "1"

[capabilities.adapter]
kind = "openai_chat"
endpoint = "http://127.0.0.1:11434/v1"
model = "local-model"
