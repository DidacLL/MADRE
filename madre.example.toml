data_dir = ".madre-data"
host = "127.0.0.1"
port = 8731

[[openai_chat]]
name = "local-chat"
revision = "1"
computation_namespace = "madre.inference"
computation_name = "chat"
computation_revision = "1"
location = "owner_device"
latency = 1

[[openai_chat.inputs]]
privacy = 4

[openai_chat.inputs.material_type]
module = "installed-chat"
name = "chat-request"
media_type = "application/json"

[openai_chat.output_type]
module = "installed-chat"
name = "chat-response"
media_type = "application/json"

[openai_chat.adapter]
endpoint = "http://127.0.0.1:11434/v1"
model = "local-model"
