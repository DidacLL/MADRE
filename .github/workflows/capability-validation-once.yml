name: One-shot capability path validation

on:
  push:
    branches: [agentic/lane-c-boundary-repair]

permissions:
  contents: write

jobs:
  patch-build:
    if: ${{ github.event.head_commit.message == 'Tighten capability path validation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agentic/lane-c-boundary-repair
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Enforce one capability truth contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('kernel/src/Madre.Kernel/KernelEngine.cs')
          s = p.read_text()
          old = '''        foreach (InferenceCapability capability in capabilities)\n        {\n            string key = BindingKey(capability.BindingId, capability.BindingVersion);\n            if (!_bindings.ContainsKey(key))\n            {\n                throw new InvalidOperationException($"Capability {capability.CapabilityId} references missing binding {key}");\n            }\n        }'''
          new = '''        foreach (InferenceCapability capability in capabilities)\n        {\n            ValidateCapability(capability);\n            string key = BindingKey(capability.BindingId, capability.BindingVersion);\n            if (!_bindings.ContainsKey(key))\n            {\n                throw new InvalidOperationException($"Capability {capability.CapabilityId} references missing binding {key}");\n            }\n        }'''
          if old not in s:
              raise SystemExit('KernelEngine capability loop shape not found')
          s = s.replace(old, new)
          marker = '''    public Task FatalCompletion => _fatal.Task;'''
          helper = '''    private static void ValidateCapability(InferenceCapability capability)\n    {\n        if (string.IsNullOrWhiteSpace(capability.CapabilityId)\n            || string.IsNullOrWhiteSpace(capability.BindingId)\n            || string.IsNullOrWhiteSpace(capability.BindingVersion))\n        {\n            throw new ArgumentException("capability identity and binding identity/version must not be blank", nameof(capability));\n        }\n        if (capability.ExecutionPath is null\n            || capability.ExecutionPath.Location is null\n            || capability.ExecutionPath.Destination is null)\n        {\n            throw new ArgumentException($"Capability {capability.CapabilityId} requires factual execution path location and destination", nameof(capability));\n        }\n        if (!Enum.IsDefined(typeof(ExecutionLocation), capability.ExecutionPath.Location.Value)\n            || !Enum.IsDefined(typeof(FactProvenance), capability.ExecutionPath.Location.Provenance)\n            || !Enum.IsDefined(typeof(FactProvenance), capability.ExecutionPath.Destination.Provenance))\n        {\n            throw new ArgumentException($"Capability {capability.CapabilityId} contains invalid execution-path fact values", nameof(capability));\n        }\n        if (string.IsNullOrWhiteSpace(capability.ExecutionPath.Destination.Value))\n        {\n            throw new ArgumentException($"Capability {capability.CapabilityId} requires a nonblank factual destination", nameof(capability));\n        }\n        if (capability.ExecutionPath.Route is { } route\n            && (string.IsNullOrWhiteSpace(route.Value) || !Enum.IsDefined(typeof(FactProvenance), route.Provenance)))\n        {\n            throw new ArgumentException($"Capability {capability.CapabilityId} route must be a nonblank factual value with valid provenance", nameof(capability));\n        }\n        if (capability.ExecutionPath.DataRetention is { } retention\n            && (string.IsNullOrWhiteSpace(retention.Value) || !Enum.IsDefined(typeof(FactProvenance), retention.Provenance)))\n        {\n            throw new ArgumentException($"Capability {capability.CapabilityId} data retention must be a nonblank factual value with valid provenance", nameof(capability));\n        }\n        if (capability.SupportedEffort is null\n            || !Enum.IsDefined(typeof(InferenceEffort), capability.SupportedEffort.Value)\n            || !Enum.IsDefined(typeof(FactProvenance), capability.SupportedEffort.Provenance))\n        {\n            throw new ArgumentException($"Capability {capability.CapabilityId} contains invalid supported-effort fact", nameof(capability));\n        }\n    }\n\n    public Task FatalCompletion => _fatal.Task;'''
          if marker not in s:
              raise SystemExit('KernelEngine FatalCompletion marker not found')
          p.write_text(s.replace(marker, helper))

          p = Path('tests/Madre.Kernel.Acceptance/PhysicalBoundaryAcceptance.cs')
          s = p.read_text()
          old = '''    private static async Task PhysicalEligibilityContractAsync()\n    {\n        using var temp = new TempDir("madre-physical-boundary");'''
          new = '''    private static async Task PhysicalEligibilityContractAsync()\n    {\n        using var temp = new TempDir("madre-physical-boundary");\n        AssertInvalidCustomCapabilityPath(temp.Path);'''
          if old not in s:
              raise SystemExit('PhysicalBoundary acceptance entry shape not found')
          s = s.replace(old, new)
          marker = '''    private static async Task JavaPhysicalBoundaryContractAsync()'''
          helper = '''    private static void AssertInvalidCustomCapabilityPath(string directory)\n    {\n        var invalid = new InferenceCapability(\n            "invalid-path",\n            "boundary/invalid",\n            "1",\n            new CapabilityExecutionPath(\n                new ConfiguredFact<ExecutionLocation>(ExecutionLocation.External, FactProvenance.Owner),\n                new ConfiguredFact<string>(" ", FactProvenance.Owner)),\n            new ConfiguredFact<InferenceEffort>(InferenceEffort.Standard, FactProvenance.Owner),\n            1);\n        bool rejected = false;\n        try\n        {\n            _ = new KernelEngine(\n                new WorkStore(Path.Combine(directory, "invalid-path.db")),\n                [invalid],\n                [new FixedBinding("boundary/invalid", CapabilityAvailability.Available, false)],\n                1);\n        }\n        catch (ArgumentException ex) when (ex.Message.Contains("destination", StringComparison.OrdinalIgnoreCase))\n        {\n            rejected = true;\n        }\n        Check(rejected, "programmatic capability bypassed factual execution-path validation");\n    }\n\n    private static async Task JavaPhysicalBoundaryContractAsync()'''
          if marker not in s:
              raise SystemExit('Java physical boundary marker not found')
          p.write_text(s.replace(marker, helper))
          PY

      - name: Build physical projects
        shell: bash
        run: |
          ./gradlew --no-daemon clean build
          dotnet build tests/Madre.Kernel.Acceptance/Madre.Kernel.Acceptance.csproj --configuration Release
          dotnet build tests/Madre.Kernel.Verification/Madre.Kernel.Verification.csproj --configuration Release
      - name: Commit validation
        shell: bash
        run: |
          git config user.name 'MADRE boundary worker'
          git config user.email 'actions@users.noreply.github.com'
          git add kernel/src/Madre.Kernel/KernelEngine.cs tests/Madre.Kernel.Acceptance/PhysicalBoundaryAcceptance.cs
          git commit -m 'Validate factual capability paths across construction surfaces'
          git push origin HEAD:agentic/lane-c-boundary-repair
