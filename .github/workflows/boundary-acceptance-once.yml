name: One-shot Lane C Boundary Acceptance

on:
  push:
    branches: [agentic/lane-c-boundary-repair]

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ github.event.head_commit.message == 'Run boundary acceptance' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agentic/lane-c-boundary-repair
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Java physical client
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon clean build
      - name: Build Java physical client
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean build
      - name: Build acceptance
        run: dotnet build tests/Madre.Kernel.Acceptance/Madre.Kernel.Acceptance.csproj --configuration Release
      - name: Run Lane C acceptance
        run: dotnet run --project tests/Madre.Kernel.Acceptance/Madre.Kernel.Acceptance.csproj --configuration Release --no-build
