name: Java 21 cross-platform build

on:
  push:
    branches:
      - main
      - 'architecture/**'
      - 'probe/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      production: ${{ steps.scope.outputs.production }}
      sdk-consumer: ${{ steps.scope.outputs.sdk-consumer }}
      reasoning-consumer: ${{ steps.scope.outputs.reasoning-consumer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = if ($env:PR_HEAD_SHA) { $env:PR_HEAD_SHA } else { $env:CURRENT_SHA }
          $forceFull = $false

          if ($env:EVENT_NAME -eq 'pull_request' -and $env:PR_BASE_SHA) {
            # A PR run validates the complete proposed change, not only its latest synchronize delta.
            $base = $env:PR_BASE_SHA
          }
          else {
            $base = $env:BEFORE_SHA
            if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
              $forceFull = $true
            }
          }

          $files = @()
          if (-not $forceFull) {
            $files = @(git diff --name-only $base $head)
            if ($LASTEXITCODE -ne 0) { throw "Unable to classify changes between $base and $head" }
          }

          $buildLogic = '^(build\.gradle\.kts|settings\.gradle\.kts|gradlew|gradlew\.bat|gradle/|\.github/workflows/build\.yml)($|/)'
          $anySource = '^madre-[^/]+/src/'
          $productionSource = '^madre-[^/]+/src/main/'
          $sdkSurface = '^(madre-algebra/src/main/|madre-sdk/src/main/|madre-text-inference/src/main/|verification/sdk-consumer/)'
          $reasoningSurface = '^(madre-algebra/src/main/|madre-sdk/src/main/|madre-reasoning-spi/|madre-text-inference/|verification/reasoning-consumer/)'

          $verify = $forceFull
          $production = $forceFull
          $sdkConsumer = $forceFull
          $reasoningConsumer = $forceFull

          foreach ($file in $files) {
            if ($file -match $buildLogic -or $file -match $anySource -or $file -match '^verification/(sdk|reasoning)-consumer/') {
              $verify = $true
            }
            if ($file -match $buildLogic -or $file -match $productionSource) {
              $production = $true
            }
            if ($file -match $buildLogic -or $file -match $sdkSurface) {
              $sdkConsumer = $true
            }
            if ($file -match $buildLogic -or $file -match $reasoningSurface) {
              $reasoningConsumer = $true
            }
          }

          "verify=$($verify.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "production=$($production.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "sdk-consumer=$($sdkConsumer.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "reasoning-consumer=$($reasoningConsumer.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "Changed files: $($files.Count); verify=$verify; production=$production; sdk-consumer=$sdkConsumer; reasoning-consumer=$reasoningConsumer"
          $files | ForEach-Object { Write-Host "  $_" }

  build:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Verify on Linux
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon --build-cache check
      - name: Verify production documentation and packages on Linux
        if: runner.os == 'Linux' && needs.changes.outputs.production == 'true'
        run: ./gradlew --no-daemon --build-cache javadoc publish installDist distZip
      - name: Build isolated executable Module on Linux
        if: runner.os == 'Linux' && needs.changes.outputs.sdk-consumer == 'true'
        run: ./gradlew --no-daemon --build-cache -p verification/sdk-consumer jar
      - name: Build isolated ReasoningCapability on Linux
        if: runner.os == 'Linux' && needs.changes.outputs.reasoning-consumer == 'true'
        run: ./gradlew --no-daemon --build-cache -p verification/reasoning-consumer jar
      - name: Verify independent Module with no reasoning mechanisms on Linux
        if: runner.os == 'Linux' && needs.changes.outputs.production == 'true' && needs.changes.outputs.sdk-consumer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          module_dir="$RUNNER_TEMP/no-reasoning-modules"
          reasoning_dir="$RUNNER_TEMP/no-reasoning-mechanisms"
          mkdir -p "$module_dir" "$reasoning_dir"
          cp verification/sdk-consumer/build/libs/independent-module.jar "$module_dir/independent-module.jar"
          state_dir="$RUNNER_TEMP/madre-no-reasoning-state"
          database="$RUNNER_TEMP/madre-no-reasoning.sqlite"
          config="$RUNNER_TEMP/madre-no-reasoning.properties"
          printf 'kernel.database=%s\nmodules.directory=%s\nmodules.state-directory=%s\nreasoning.directory=%s\n' \
            "$database" "$module_dir" "$state_dir" "$reasoning_dir" > "$config"
          output="$(madre-app/build/install/madre/bin/madre "$config" \
            --invoke-public phd.module inspect request S4 hello 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F 'public:hello'
          if printf '%s\n' "$output" | grep -F 'private:hello'; then
            echo 'raw internal Material crossed the public boundary' >&2
            exit 1
          fi
      - name: Verify independently installed reasoning execution on Linux
        if: runner.os == 'Linux' && needs.changes.outputs.production == 'true' && needs.changes.outputs.sdk-consumer == 'true' && needs.changes.outputs.reasoning-consumer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp verification/sdk-consumer/build/libs/independent-module.jar \
            madre-app/build/install/madre/modules/independent-module.jar
          cp verification/reasoning-consumer/build/libs/independent-reasoning.jar \
            madre-app/build/install/madre/reasoning/independent-reasoning.jar
          module_dir="$(cd madre-app/build/install/madre/modules && pwd)"
          reasoning_dir="$(cd madre-app/build/install/madre/reasoning && pwd)"
          ls "$reasoning_dir" | grep -F 'madre-adapter-llamacpp'
          ls "$reasoning_dir" | grep -F 'madre-adapter-openai-compatible'
          state_dir="$RUNNER_TEMP/madre-reasoning-state"
          database="$RUNNER_TEMP/madre-independent-reasoning.sqlite"
          config="$RUNNER_TEMP/madre-independent-reasoning.properties"
          printf 'kernel.database=%s\nmodules.directory=%s\nmodules.state-directory=%s\nreasoning.directory=%s\nreasoning.independent-text.instances=deterministic\nreasoning.independent-text.deterministic.enabled=true\nreasoning.independent-text.deterministic.id=independent-text\nreasoning.independent-text.deterministic.privacy=SECRET\nreasoning.independent-text.deterministic.location=LOCAL\nreasoning.independent-text.deterministic.expected-latency-ms=1\nreasoning.independent-text.deterministic.preference=1000\n' \
            "$database" "$module_dir" "$state_dir" "$reasoning_dir" > "$config"
          output="$(madre-app/build/install/madre/bin/madre "$config" \
            --invoke-public phd.module reason request S4 hello 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F 'public:reasoned:independent:hello'
          if printf '%s\n' "$output" | grep -F 'private:reasoned:'; then
            echo 'raw reasoning-derived Material crossed the public boundary' >&2
            exit 1
          fi
      - name: Smoke installed application on Linux
        if: runner.os == 'Linux' && needs.changes.outputs.production == 'true'
        shell: bash
        run: |
          set +e
          output="$(madre-app/build/install/madre/bin/madre 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          printf '%s\n' "$output" | grep -F 'usage: madre <path-to-madre.properties>'

      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --build-cache check
      - name: Verify production documentation and packages on Windows
        if: runner.os == 'Windows' && needs.changes.outputs.production == 'true'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --build-cache javadoc publish installDist distZip
      - name: Build isolated executable Module on Windows
        if: runner.os == 'Windows' && needs.changes.outputs.sdk-consumer == 'true'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --build-cache -p verification/sdk-consumer jar
      - name: Build isolated ReasoningCapability on Windows
        if: runner.os == 'Windows' && needs.changes.outputs.reasoning-consumer == 'true'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --build-cache -p verification/reasoning-consumer jar
      - name: Verify independent Module with no reasoning mechanisms on Windows
        if: runner.os == 'Windows' && needs.changes.outputs.production == 'true' && needs.changes.outputs.sdk-consumer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $moduleDir = Join-Path $env:RUNNER_TEMP 'no-reasoning-modules'
          $reasoningDir = Join-Path $env:RUNNER_TEMP 'no-reasoning-mechanisms'
          New-Item -ItemType Directory -Force -Path $moduleDir, $reasoningDir | Out-Null
          Copy-Item 'verification\sdk-consumer\build\libs\independent-module.jar' (Join-Path $moduleDir 'independent-module.jar')
          $stateDir = (Join-Path $env:RUNNER_TEMP 'madre-no-reasoning-state').Replace('\', '/')
          $database = (Join-Path $env:RUNNER_TEMP 'madre-no-reasoning.sqlite').Replace('\', '/')
          $config = Join-Path $env:RUNNER_TEMP 'madre-no-reasoning.properties'
          @(
            "kernel.database=$database",
            "modules.directory=$($moduleDir.Replace('\', '/'))",
            "modules.state-directory=$stateDir",
            "reasoning.directory=$($reasoningDir.Replace('\', '/'))"
          ) | Set-Content -Path $config -Encoding utf8
          $output = (& '.\madre-app\build\install\madre\bin\madre.bat' $config `
            --invoke-public phd.module inspect request S4 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $output; throw 'no-reasoning Module invocation failed' }
          Write-Host $output
          if ($output -notmatch 'public:hello') { throw 'minimized PUBLIC result was not returned' }
          if ($output -match 'private:hello') { throw 'raw internal Material crossed the public boundary' }
      - name: Verify independently installed reasoning execution on Windows
        if: runner.os == 'Windows' && needs.changes.outputs.production == 'true' && needs.changes.outputs.sdk-consumer == 'true' && needs.changes.outputs.reasoning-consumer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'verification\sdk-consumer\build\libs\independent-module.jar' `
            'madre-app\build\install\madre\modules\independent-module.jar'
          Copy-Item 'verification\reasoning-consumer\build\libs\independent-reasoning.jar' `
            'madre-app\build\install\madre\reasoning\independent-reasoning.jar'
          $shipped = @(Get-ChildItem 'madre-app\build\install\madre\reasoning' -Filter '*.jar' | Select-Object -ExpandProperty Name)
          if (-not ($shipped -match 'madre-adapter-llamacpp')) { throw 'shipped llama.cpp adapter is missing from reasoning installation directory' }
          if (-not ($shipped -match 'madre-adapter-openai-compatible')) { throw 'shipped OpenAI-compatible adapter is missing from reasoning installation directory' }
          $moduleDir = (Resolve-Path 'madre-app\build\install\madre\modules').Path.Replace('\', '/')
          $reasoningDir = (Resolve-Path 'madre-app\build\install\madre\reasoning').Path.Replace('\', '/')
          $stateDir = (Join-Path $env:RUNNER_TEMP 'madre-reasoning-state').Replace('\', '/')
          $database = (Join-Path $env:RUNNER_TEMP 'madre-independent-reasoning.sqlite').Replace('\', '/')
          $config = Join-Path $env:RUNNER_TEMP 'madre-independent-reasoning.properties'
          @(
            "kernel.database=$database",
            "modules.directory=$moduleDir",
            "modules.state-directory=$stateDir",
            "reasoning.directory=$reasoningDir",
            'reasoning.independent-text.instances=deterministic',
            'reasoning.independent-text.deterministic.enabled=true',
            'reasoning.independent-text.deterministic.id=independent-text',
            'reasoning.independent-text.deterministic.privacy=SECRET',
            'reasoning.independent-text.deterministic.location=LOCAL',
            'reasoning.independent-text.deterministic.expected-latency-ms=1',
            'reasoning.independent-text.deterministic.preference=1000'
          ) | Set-Content -Path $config -Encoding utf8
          $output = (& '.\madre-app\build\install\madre\bin\madre.bat' $config `
            --invoke-public phd.module reason request S4 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $output; throw 'independent reasoning invocation failed' }
          Write-Host $output
          if ($output -notmatch 'public:reasoned:independent:hello') { throw 'independent ReasoningCapability result was not returned through PUBLIC transformation' }
          if ($output -match 'private:reasoned:') { throw 'raw reasoning-derived Material crossed the public boundary' }
      - name: Smoke installed application on Windows
        if: runner.os == 'Windows' && needs.changes.outputs.production == 'true'
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'madre-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'madre-stderr.txt'
          $process = Start-Process -FilePath '.\madre-app\build\install\madre\bin\madre.bat' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = (Get-Content $stdout -Raw) + (Get-Content $stderr -Raw)
          if ($process.ExitCode -ne 2) {
            Write-Host $output
            throw "MADRE Windows application exited with $($process.ExitCode) instead of 2"
          }
          if ($output -notmatch 'usage: madre <path-to-madre\.properties>') {
            Write-Host $output
            throw 'MADRE Windows application did not print usage'
          }
