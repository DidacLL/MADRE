name: MADRE Lane C validation

on:
  pull_request:
  push:
    branches: [main, 'agentic/lane-c-engine-contract-repair']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build dependency
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build native Kernel and deterministic process fixture
        run: |
          cmake -S kernel -B kernel/build -DCMAKE_BUILD_TYPE=Release
          cmake --build kernel/build --parallel 2
      - name: Run native unit tests
        run: ctest --test-dir kernel/build --output-on-failure
      - name: Build Java physical client and acceptance harness
        run: ./gradlew --no-daemon clean build
      - name: Prove LCR1 physical invocation, durability, containment and restart semantics
        run: |
          python3 ./kernel/tests/lcr1_acceptance.py \
            ./kernel/build/madre-kernel \
            ./kernel/build/madre-process-fixture \
            'madre-kernel-client/build/classes/java/main:madre-kernel-client/build/classes/java/test'
      - name: Audit production Kernel for provider/runtime contamination
        run: |
          if grep -RniE 'llama|GGUF|Ollama|OpenAI|Anthropic|Gemini|LM Studio|vLLM' kernel/src kernel/CMakeLists.txt; then
            echo 'Provider/runtime-specific production Kernel contamination found' >&2
            exit 1
          fi
          if grep -RniE 'EngineDescriptor|engine_inventory|WorkerPool|warm worker|required_capabilities|eligible_engine_ids|exact_model_id|exact_engine_id|Effort' kernel/src madre-kernel-client/src/main/java; then
            echo 'Rejected inference-ownership abstraction found in active production sources' >&2
            exit 1
          fi

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native SQLite dependency
        shell: pwsh
        run: vcpkg install sqlite3:x64-windows-static
      - name: Build native Kernel and deterministic process fixture
        shell: pwsh
        run: |
          cmake -S kernel -B kernel/build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build kernel/build --config Release --parallel 2
      - name: Run native unit tests
        shell: pwsh
        run: ctest --test-dir kernel/build -C Release --output-on-failure
      - name: Build Java physical client and acceptance harness
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean build
      - name: Prove LCR1 Windows named-pipe and one-shot process contract
        shell: pwsh
        run: |
          python .\kernel\tests\lcr1_acceptance.py `
            .\kernel\build\Release\madre-kernel.exe `
            .\kernel\build\Release\madre-process-fixture.exe `
            'madre-kernel-client\build\classes\java\main;madre-kernel-client\build\classes\java\test'
