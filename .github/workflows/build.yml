name: MADRE Lane C

on:
  pull_request:
  push:
    branches: [main, 'agentic/lane-c-engine-contract-repair']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lane-c-linux:
    name: Lane C Linux acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Java physical client and acceptance tooling
        run: ./gradlew --no-daemon clean build
      - name: Build Lane C acceptance
        run: dotnet build tests/Madre.Kernel.Acceptance/Madre.Kernel.Acceptance.csproj --configuration Release
      - name: Run complete Lane C acceptance
        run: dotnet run --project tests/Madre.Kernel.Acceptance/Madre.Kernel.Acceptance.csproj --configuration Release --no-build

  lane-c-windows:
    name: Lane C Windows acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Java physical client and acceptance tooling
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean build
      - name: Build Lane C acceptance
        shell: pwsh
        run: dotnet build tests/Madre.Kernel.Acceptance/Madre.Kernel.Acceptance.csproj --configuration Release
      - name: Run complete Lane C acceptance
        shell: pwsh
        run: dotnet run --project tests/Madre.Kernel.Acceptance/Madre.Kernel.Acceptance.csproj --configuration Release --no-build
