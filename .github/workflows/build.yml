name: MADRE Lane C validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build dependency
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build native Kernel
        run: |
          cmake -S kernel -B kernel/build -DCMAKE_BUILD_TYPE=Release
          cmake --build kernel/build --parallel 2
      - name: Run native unit tests
        run: ctest --test-dir kernel/build --output-on-failure
      - name: Build Java physical client
        run: ./gradlew --no-daemon clean build
      - name: Prove caller-disappearance durability
        run: ./kernel/tests/caller_disappearance.sh ./kernel/build/madre-kernel 'madre-kernel-client/build/classes/java/main:madre-kernel-client/build/classes/java/test'
