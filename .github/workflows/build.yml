name: MADRE Lane C validation

on:
  pull_request:
  push:
    branches: [main, 'agentic/c2-scheduling-recovery', 'agentic/c3-worker-resources', 'agentic/c4-llamacpp-worker']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build dependency
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build native Kernel
        run: |
          cmake -S kernel -B kernel/build -DCMAKE_BUILD_TYPE=Release
          cmake --build kernel/build --parallel 2
      - name: Run native unit tests
        run: ctest --test-dir kernel/build --output-on-failure
      - name: Build Java physical client
        run: ./gradlew --no-daemon clean build
      - name: Prove caller-disappearance durability
        run: ./kernel/tests/caller_disappearance.sh ./kernel/build/madre-kernel 'madre-kernel-client/build/classes/java/main:madre-kernel-client/build/classes/java/test'
      - name: Prove C2 scheduling and restart recovery
        run: python3 ./kernel/tests/c2_acceptance.py ./kernel/build/madre-kernel 'madre-kernel-client/build/classes/java/main:madre-kernel-client/build/classes/java/test'
      - name: Prove C3 worker lifecycle and resource accounting
        run: python3 ./kernel/tests/c3_acceptance.py ./kernel/build/madre-kernel ./kernel/build/madre-fake-worker 'madre-kernel-client/build/classes/java/main:madre-kernel-client/build/classes/java/test'

      - name: Checkout pinned llama.cpp for C4
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout 26394b4e6749a41c3633db040e0987500a5f7013
      - name: Download pinned small C4 model
        run: |
          mkdir -p kernel/test-models
          curl -L --fail --retry 3 -o kernel/test-models/SmolLM2-135M-Instruct-Q8_0.gguf 'https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q8_0.gguf?download=true'
          echo 'c4a3dd037301b6ecea31d6da37f5cd793ead920dd5ddfe6d589294628d6ce66a  kernel/test-models/SmolLM2-135M-Instruct-Q8_0.gguf' | sha256sum -c -
      - name: Build optional native llama.cpp worker
        run: |
          cmake -S kernel -B kernel/build-c4 -DCMAKE_BUILD_TYPE=Release -DMADRE_BUILD_LLAMACPP_WORKER=ON -DMADRE_LLAMA_CPP_DIR=/tmp/llama.cpp
          cmake --build kernel/build-c4 --parallel 2 --target madre-kernel madre-llamacpp-worker
      - name: Prove C4 real native llama.cpp inference and supervision
        run: |
          python3 ./kernel/tests/c4_acceptance.py ./kernel/build-c4/madre-kernel ./kernel/build-c4/madre-llamacpp-worker ./kernel/test-models/SmolLM2-135M-Instruct-Q8_0.gguf 'madre-kernel-client/build/classes/java/main:madre-kernel-client/build/classes/java/test'
