name: Java 21 cross-platform build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build, verify and package on Linux
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon clean check javadoc publish installDist distZip
      - name: Verify isolated SDK consumer on Linux
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon -p verification/sdk-consumer clean compileJava
      - name: Smoke installed application on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          output="$(madre-app/build/install/madre/bin/madre 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          printf '%s\n' "$output" | grep -F 'usage: madre <path-to-madre.properties>'

      - name: Build, verify and package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean check javadoc publish installDist distZip
      - name: Verify isolated SDK consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon -p verification/sdk-consumer clean compileJava
      - name: Smoke installed application on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'madre-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'madre-stderr.txt'
          $process = Start-Process -FilePath '.\madre-app\build\install\madre\bin\madre.bat' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = (Get-Content $stdout -Raw) + (Get-Content $stderr -Raw)
          if ($process.ExitCode -ne 2) {
            Write-Host $output
            throw "MADRE Windows application exited with $($process.ExitCode) instead of 2"
          }
          if ($output -notmatch 'usage: madre <path-to-madre\.properties>') {
            Write-Host $output
            throw 'MADRE Windows application did not print usage'
          }
