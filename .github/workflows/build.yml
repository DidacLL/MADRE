name: Java 21 cross-platform build

on:
  push:
    branches:
      - main
      - 'architecture/**'
      - 'probe/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      production: ${{ steps.scope.outputs.production }}
      sdk-consumer: ${{ steps.scope.outputs.sdk-consumer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = if ($env:PR_HEAD_SHA) { $env:PR_HEAD_SHA } else { $env:CURRENT_SHA }
          $base = $env:BEFORE_SHA
          $forceFull = $false

          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            if ($env:EVENT_NAME -eq 'pull_request' -and $env:PR_BASE_SHA) {
              $base = $env:PR_BASE_SHA
            }
            else {
              $forceFull = $true
            }
          }

          $files = @()
          if (-not $forceFull) {
            $files = @(git diff --name-only $base $head)
            if ($LASTEXITCODE -ne 0) { throw "Unable to classify changes between $base and $head" }
          }

          $buildLogic = '^(build\.gradle\.kts|settings\.gradle\.kts|gradlew|gradlew\.bat|gradle/|\.github/workflows/build\.yml)($|/)'
          $anySource = '^madre-[^/]+/src/'
          $productionSource = '^madre-[^/]+/src/main/'
          $sdkSurface = '^(madre-algebra/src/main/|madre-sdk/src/main/|verification/sdk-consumer/)'

          $verify = $forceFull
          $production = $forceFull
          $sdkConsumer = $forceFull

          foreach ($file in $files) {
            if ($file -match $buildLogic -or $file -match $anySource -or $file -match '^verification/sdk-consumer/') {
              $verify = $true
            }
            if ($file -match $buildLogic -or $file -match $productionSource) {
              $production = $true
            }
            if ($file -match $buildLogic -or $file -match $sdkSurface) {
              $sdkConsumer = $true
            }
          }

          "verify=$($verify.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "production=$($production.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "sdk-consumer=$($sdkConsumer.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "Changed files: $($files.Count); verify=$verify; production=$production; sdk-consumer=$sdkConsumer"
          $files | ForEach-Object { Write-Host "  $_" }

  build:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Verify on Linux
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon --build-cache check
      - name: Verify production documentation and packages on Linux
        if: runner.os == 'Linux' && needs.changes.outputs.production == 'true'
        run: ./gradlew --no-daemon --build-cache javadoc publish installDist distZip
      - name: Build isolated executable Module on Linux
        if: runner.os == 'Linux' && needs.changes.outputs.sdk-consumer == 'true'
        run: ./gradlew --no-daemon --build-cache -p verification/sdk-consumer jar
      - name: Verify independent Module installation and PUBLIC invocation on Linux
        if: runner.os == 'Linux' && needs.changes.outputs.production == 'true' && needs.changes.outputs.sdk-consumer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp verification/sdk-consumer/build/libs/independent-module.jar \
            madre-app/build/install/madre/modules/independent-module.jar
          module_dir="$(cd madre-app/build/install/madre/modules && pwd)"
          state_dir="$RUNNER_TEMP/madre-module-state"
          database="$RUNNER_TEMP/madre-independent.sqlite"
          config="$RUNNER_TEMP/madre-independent.properties"
          printf 'kernel.database=%s\nmodules.directory=%s\nmodules.state-directory=%s\n' \
            "$database" "$module_dir" "$state_dir" > "$config"
          output="$(madre-app/build/install/madre/bin/madre "$config" \
            --invoke-public phd.module inspect request S4 hello 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F 'public:hello'
          if printf '%s\n' "$output" | grep -F 'private:hello'; then
            echo 'raw internal Material crossed the public boundary' >&2
            exit 1
          fi
      - name: Smoke installed application on Linux
        if: runner.os == 'Linux' && needs.changes.outputs.production == 'true'
        shell: bash
        run: |
          set +e
          output="$(madre-app/build/install/madre/bin/madre 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          printf '%s\n' "$output" | grep -F 'usage: madre <path-to-madre.properties>'

      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --build-cache check
      - name: Verify production documentation and packages on Windows
        if: runner.os == 'Windows' && needs.changes.outputs.production == 'true'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --build-cache javadoc publish installDist distZip
      - name: Build isolated executable Module on Windows
        if: runner.os == 'Windows' && needs.changes.outputs.sdk-consumer == 'true'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --build-cache -p verification/sdk-consumer jar
      - name: Verify independent Module installation and PUBLIC invocation on Windows
        if: runner.os == 'Windows' && needs.changes.outputs.production == 'true' && needs.changes.outputs.sdk-consumer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'verification\sdk-consumer\build\libs\independent-module.jar' `
            'madre-app\build\install\madre\modules\independent-module.jar'
          $moduleDir = (Resolve-Path 'madre-app\build\install\madre\modules').Path.Replace('\', '/')
          $stateDir = (Join-Path $env:RUNNER_TEMP 'madre-module-state').Replace('\', '/')
          $database = (Join-Path $env:RUNNER_TEMP 'madre-independent.sqlite').Replace('\', '/')
          $config = Join-Path $env:RUNNER_TEMP 'madre-independent.properties'
          @(
            "kernel.database=$database",
            "modules.directory=$moduleDir",
            "modules.state-directory=$stateDir"
          ) | Set-Content -Path $config -Encoding utf8
          $output = (& '.\madre-app\build\install\madre\bin\madre.bat' $config `
            --invoke-public phd.module inspect request S4 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $output; throw 'independent Module invocation failed' }
          Write-Host $output
          if ($output -notmatch 'public:hello') { throw 'minimized PUBLIC result was not returned' }
          if ($output -match 'private:hello') { throw 'raw internal Material crossed the public boundary' }
      - name: Smoke installed application on Windows
        if: runner.os == 'Windows' && needs.changes.outputs.production == 'true'
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'madre-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'madre-stderr.txt'
          $process = Start-Process -FilePath '.\madre-app\build\install\madre\bin\madre.bat' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = (Get-Content $stdout -Raw) + (Get-Content $stderr -Raw)
          if ($process.ExitCode -ne 2) {
            Write-Host $output
            throw "MADRE Windows application exited with $($process.ExitCode) instead of 2"
          }
          if ($output -notmatch 'usage: madre <path-to-madre\.properties>') {
            Write-Host $output
            throw 'MADRE Windows application did not print usage'
          }
