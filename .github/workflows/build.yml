name: MADRE validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon clean build
      - name: Compile an external Module against the SDK jar only
        run: ./gradlew --no-daemon -p verification/sdk-consumer clean build

  windows-installed-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and start installed runtime without inference providers
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon clean build :madre-runtime:installDist
          if ($LASTEXITCODE -ne 0) { throw 'MADRE build failed' }
          $env:JAVA_OPTS = "-Dmadre.state=$env:RUNNER_TEMP\madre-smoke"
          & .\madre-runtime\build\install\madre\bin\madre.bat
          if ($LASTEXITCODE -ne 0) { throw 'MADRE installed runtime failed to start' }
