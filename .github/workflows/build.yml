name: Java 21 cross-platform build

on:
  push:
    branches:
      - main
      - 'architecture/**'
      - 'probe/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      production: ${{ steps.scope.outputs.production }}
      sdk-consumer: ${{ steps.scope.outputs.sdk-consumer }}
      reasoning-consumer: ${{ steps.scope.outputs.reasoning-consumer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = if ($env:PR_HEAD_SHA) { $env:PR_HEAD_SHA } else { $env:CURRENT_SHA }
          $forceFull = $false
          if ($env:EVENT_NAME -eq 'pull_request' -and $env:PR_BASE_SHA) {
            $base = $env:PR_BASE_SHA
          } else {
            $base = $env:BEFORE_SHA
            if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') { $forceFull = $true }
          }
          $files = @()
          if (-not $forceFull) {
            $files = @(git diff --name-only $base $head)
            if ($LASTEXITCODE -ne 0) { throw "Unable to classify changes between $base and $head" }
          }
          $buildLogic = '^(build\.gradle\.kts|settings\.gradle\.kts|gradlew|gradlew\.bat|gradle/|\.github/workflows/build\.yml)($|/)'
          $anySource = '^madre-[^/]+/src/'
          $productionSource = '^madre-[^/]+/src/main/'
          $sdkSurface = '^(madre-algebra/src/main/|madre-sdk/src/main/|madre-text-(inference|generation)/src/main/|madre-embeddings/src/main/|verification/sdk-consumer/|verification/module-interoperability/)'
          $reasoningSurface = '^(madre-algebra/src/main/|madre-sdk/src/main/|madre-reasoning-spi/|madre-text-(inference|generation)/|madre-embeddings/|verification/reasoning-consumer/)'
          $ownerAcceptance = '^verification/installed-owner-acceptance\.ps1$'
          $interopAcceptance = '^verification/module-interoperability/'
          $verify = $forceFull
          $production = $forceFull
          $sdkConsumer = $forceFull
          $reasoningConsumer = $forceFull
          foreach ($file in $files) {
            if ($file -match $buildLogic -or $file -match $anySource -or $file -match '^verification/(sdk|reasoning)-consumer/' -or $file -match $ownerAcceptance -or $file -match $interopAcceptance) { $verify = $true }
            if ($file -match $buildLogic -or $file -match $productionSource -or $file -match $ownerAcceptance -or $file -match $interopAcceptance) { $production = $true }
            if ($file -match $buildLogic -or $file -match $sdkSurface -or $file -match $ownerAcceptance) { $sdkConsumer = $true }
            if ($file -match $buildLogic -or $file -match $reasoningSurface -or $file -match $ownerAcceptance) { $reasoningConsumer = $true }
          }
          "verify=$($verify.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "production=$($production.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "sdk-consumer=$($sdkConsumer.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "reasoning-consumer=$($reasoningConsumer.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Changed files: $($files.Count); verify=$verify; production=$production; sdk-consumer=$sdkConsumer; reasoning-consumer=$reasoningConsumer"
          $files | ForEach-Object { Write-Host "  $_" }

  build:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\gradlew.bat' } else { './gradlew' }
          & $gradle --no-daemon --build-cache check
          if ($LASTEXITCODE -ne 0) { throw 'Gradle check failed' }

      - name: Verify production documentation and packages
        if: needs.changes.outputs.production == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\gradlew.bat' } else { './gradlew' }
          & $gradle --no-daemon --build-cache javadoc publish installDist distZip
          if ($LASTEXITCODE -ne 0) { throw 'production build failed' }

      - name: Build isolated executable Module
        if: needs.changes.outputs.sdk-consumer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\gradlew.bat' } else { './gradlew' }
          & $gradle --no-daemon --build-cache -p verification/sdk-consumer jar
          if ($LASTEXITCODE -ne 0) { throw 'independent Module build failed' }

      - name: Build isolated Module interoperability proof
        if: needs.changes.outputs.sdk-consumer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\gradlew.bat' } else { './gradlew' }
          & $gradle --no-daemon --build-cache -p verification/module-interoperability :callee:jar :caller:jar
          if ($LASTEXITCODE -ne 0) { throw 'independent interoperability Module build failed' }

      - name: Build isolated ReasoningCapability
        if: needs.changes.outputs.reasoning-consumer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\gradlew.bat' } else { './gradlew' }
          & $gradle --no-daemon --build-cache -p verification/reasoning-consumer jar
          if ($LASTEXITCODE -ne 0) { throw 'independent reasoning build failed' }

      - name: Verify independent Module with no reasoning mechanisms
        if: needs.changes.outputs.production == 'true' && needs.changes.outputs.sdk-consumer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Slash([string]$value) { return $value.Replace('\', '/') }
          $moduleDir = Join-Path $env:RUNNER_TEMP 'no-reasoning-modules'
          $reasoningDir = Join-Path $env:RUNNER_TEMP 'no-reasoning-mechanisms'
          New-Item -ItemType Directory -Force -Path $moduleDir, $reasoningDir | Out-Null
          Copy-Item 'verification/sdk-consumer/build/libs/independent-module.jar' (Join-Path $moduleDir 'independent-module.jar')
          $stateDir = Join-Path $env:RUNNER_TEMP 'madre-no-reasoning-state'
          $database = Join-Path $env:RUNNER_TEMP 'madre-no-reasoning.sqlite'
          $config = Join-Path $env:RUNNER_TEMP 'madre-no-reasoning.properties'
          @(
            "kernel.database=$(Slash $database)",
            "modules.directory=$(Slash $moduleDir)",
            "modules.state-directory=$(Slash $stateDir)",
            "reasoning.directory=$(Slash $reasoningDir)"
          ) | Set-Content -Path $config -Encoding utf8
          $launcher = if ($IsWindows) { '.\madre-app\build\install\madre\bin\madre.bat' } else { './madre-app/build/install/madre/bin/madre' }
          $output = (& $launcher $config --invoke-public phd.module inspect request S4 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $output; throw 'no-reasoning Module invocation failed' }
          Write-Host $output
          if ($output -notmatch 'public:hello') { throw 'minimized PUBLIC result was not returned' }
          if ($output -match 'private:hello') { throw 'raw internal Material crossed the public boundary' }

      - name: Verify installed Module-to-Module receiver boundary
        if: needs.changes.outputs.production == 'true' && needs.changes.outputs.sdk-consumer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Slash([string]$value) { return $value.Replace('\', '/') }
          $moduleDir = Join-Path $env:RUNNER_TEMP 'interop-modules'
          $reasoningDir = Join-Path $env:RUNNER_TEMP 'interop-reasoning'
          New-Item -ItemType Directory -Force -Path $moduleDir, $reasoningDir | Out-Null
          Copy-Item 'verification/module-interoperability/callee/build/libs/interop-callee.jar' (Join-Path $moduleDir 'interop-callee.jar')
          Copy-Item 'verification/module-interoperability/caller/build/libs/interop-caller.jar' (Join-Path $moduleDir 'interop-caller.jar')
          $stateDir = Join-Path $env:RUNNER_TEMP 'madre-interop-state'
          $database = Join-Path $env:RUNNER_TEMP 'madre-interop.sqlite'
          $config = Join-Path $env:RUNNER_TEMP 'madre-interop.properties'
          @(
            "kernel.database=$(Slash $database)",
            "modules.directory=$(Slash $moduleDir)",
            "modules.state-directory=$(Slash $stateDir)",
            "reasoning.directory=$(Slash $reasoningDir)"
          ) | Set-Content -Path $config -Encoding utf8
          $launcher = if ($IsWindows) { '.\madre-app\build\install\madre\bin\madre.bat' } else { './madre-app/build/install/madre/bin/madre' }

          $calleeOwner = (& $launcher $config --invoke-owner interop.callee sensitive request S2 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $calleeOwner; throw 'callee owner-local invocation failed' }
          Write-Host $calleeOwner
          if ($calleeOwner -notmatch 'S4\s+classified:hello') { throw 'callee did not produce raw S4 owner-local Material' }

          $calleePublic = (& $launcher $config --invoke-public interop.callee sensitive request S2 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $calleePublic; throw 'callee PUBLIC invocation failed' }
          Write-Host $calleePublic
          if ($calleePublic -notmatch 'public:callee-summary') { throw 'callee PUBLIC semantic minimization was not applied' }
          if ($calleePublic -match 'classified:hello') { throw 'callee raw S4 Material crossed external PUBLIC boundary' }

          $callerOwner = (& $launcher $config --invoke-owner interop.caller compose request S2 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $callerOwner; throw 'Module-to-Module composition failed' }
          Write-Host $callerOwner
          if ($callerOwner -notmatch 'S4\s+receivedOwner=interop\.callee;receivedId=([^;]+);receivedSensitivity=S4;adaptedOwner=interop\.caller;adaptedId=([^;]+);interpreted=interpreted:hello') {
            throw 'caller did not receive and adapt raw callee S4 Material'
          }
          $receivedId = $Matches[1]
          $adaptedId = $Matches[2]
          if ($receivedId -eq $adaptedId) { throw 'caller adaptation reused callee Material identity' }

          $callerPublic = (& $launcher $config --invoke-public interop.caller compose request S2 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $callerPublic; throw 'caller PUBLIC invocation failed' }
          Write-Host $callerPublic
          if ($callerPublic -notmatch 'public:caller-summary') { throw 'caller PUBLIC result was not minimized' }
          if ($callerPublic -match 'receivedOwner=|classified:hello') { throw 'caller raw composition evidence crossed PUBLIC boundary' }

          $tooSensitive = (& $launcher $config --invoke-owner interop.caller probe-too-sensitive request S2 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $tooSensitive; throw 'too-sensitive rejection probe failed' }
          Write-Host $tooSensitive
          if ($tooSensitive -notmatch 'S2\s+blocked:too-sensitive') { throw 'S5 foreign Material was not rejected at MODULE Privacy' }
          if ($tooSensitive -match 'too-sensitive:hello') { throw 'S5 foreign payload crossed Module receiver boundary' }

          $undeclared = (& $launcher $config --invoke-owner interop.caller probe-undeclared request S2 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $undeclared; throw 'undeclared foreign-type rejection probe failed' }
          Write-Host $undeclared
          if ($undeclared -notmatch 'S2\s+blocked:undeclared-type') { throw 'undeclared foreign Material type was not rejected' }
          if ($undeclared -match 'undeclared:hello') { throw 'undeclared foreign payload crossed Module receiver boundary' }

          $private = (& $launcher $config --invoke-owner interop.caller probe-private request S2 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $private; throw 'PRIVATE reachability probe failed' }
          Write-Host $private
          if ($private -notmatch 'S1\s+privateReachable=false') { throw 'PRIVATE Operation became reachable to another Module' }

      - name: Verify independently installed reasoning execution
        if: needs.changes.outputs.production == 'true' && needs.changes.outputs.sdk-consumer == 'true' && needs.changes.outputs.reasoning-consumer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Slash([string]$value) { return $value.Replace('\', '/') }
          $shippedReasoningDir = 'madre-app/build/install/madre/reasoning'
          $shipped = @(Get-ChildItem $shippedReasoningDir -Filter '*.jar' | Select-Object -ExpandProperty Name)
          if (-not ($shipped -match 'madre-adapter-llamacpp')) { throw 'shipped llama.cpp adapter is missing from reasoning installation directory' }
          if (-not ($shipped -match 'madre-adapter-openai-compatible')) { throw 'shipped OpenAI-compatible adapter is missing from reasoning installation directory' }
          $moduleDir = Join-Path $env:RUNNER_TEMP 'independent-reasoning-modules'
          $reasoningDir = Join-Path $env:RUNNER_TEMP 'independent-reasoning-providers'
          New-Item -ItemType Directory -Force -Path $moduleDir, $reasoningDir | Out-Null
          Copy-Item 'verification/sdk-consumer/build/libs/independent-module.jar' (Join-Path $moduleDir 'independent-module.jar') -Force
          Copy-Item 'verification/reasoning-consumer/build/libs/independent-reasoning.jar' (Join-Path $reasoningDir 'independent-reasoning.jar') -Force
          $stateDir = Join-Path $env:RUNNER_TEMP 'madre-reasoning-state'
          $database = Join-Path $env:RUNNER_TEMP 'madre-independent-reasoning.sqlite'
          $config = Join-Path $env:RUNNER_TEMP 'madre-independent-reasoning.properties'
          @(
            "kernel.database=$(Slash $database)",
            "modules.directory=$(Slash $moduleDir)",
            "modules.state-directory=$(Slash $stateDir)",
            "reasoning.directory=$(Slash $reasoningDir)",
            'reasoning.independent-text.instances=deterministic',
            'reasoning.independent-text.deterministic.enabled=true',
            'reasoning.independent-text.deterministic.id=independent-text',
            'reasoning.independent-text.deterministic.privacy=SECRET',
            'reasoning.independent-text.deterministic.location=LOCAL',
            'reasoning.independent-text.deterministic.expected-latency-ms=1',
            'reasoning.independent-text.deterministic.preference=1000'
          ) | Set-Content -Path $config -Encoding utf8
          $launcher = if ($IsWindows) { '.\madre-app\build\install\madre\bin\madre.bat' } else { './madre-app/build/install/madre/bin/madre' }
          $output = (& $launcher $config --invoke-public phd.module reason request S4 hello 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host $output; throw 'independent reasoning invocation failed' }
          Write-Host $output
          if ($output -notmatch 'public:reasoned:independent:hello') { throw 'independent ReasoningCapability result was not returned through PUBLIC transformation' }
          if ($output -match 'private:reasoned:') { throw 'raw reasoning-derived Material crossed the public boundary' }

      - name: Verify installed owner-local and PUBLIC boundaries with restart
        if: needs.changes.outputs.production == 'true' && needs.changes.outputs.sdk-consumer == 'true' && needs.changes.outputs.reasoning-consumer == 'true'
        shell: pwsh
        run: ./verification/installed-owner-acceptance.ps1

      - name: Smoke installed application
        if: needs.changes.outputs.production == 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $launcher = if ($IsWindows) { '.\madre-app\build\install\madre\bin\madre.bat' } else { './madre-app/build/install/madre/bin/madre' }
          $output = (& $launcher 2>&1 | Out-String)
          $status = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Write-Host $output
          if ($status -ne 2) { throw "MADRE exited with $status instead of 2" }
          if ($output -notmatch 'usage: madre <path-to-madre\.properties>') { throw 'MADRE application did not print usage' }
          exit 0
