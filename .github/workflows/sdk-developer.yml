name: SDK developer acceptance

on:
  pull_request:
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'madre-algebra/**'
      - 'madre-sdk/**'
      - 'madre-sdk-testkit/**'
      - 'madre-sdk-experimental/**'
      - 'madre-bom/**'
      - 'madre-text-inference/**'
      - 'madre-app/**'
      - 'verification/sdk-consumer/**'
      - '.github/workflows/sdk-developer.yml'

permissions:
  contents: read

concurrency:
  group: sdk-developer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  external-module:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD) {
            throw "checkout head $actual does not match expected exact head $env:EXPECTED_HEAD"
          }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Publish public verification artifacts and build packaged host image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\gradlew.bat' } else { './gradlew' }
          & $gradle --no-daemon --build-cache check publish :madre-app:jpackageAppImage
          if ($LASTEXITCODE -ne 0) { throw 'MADRE verification publication or host image build failed' }

      - name: Build Module from a directory outside the MADRE checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\gradlew.bat' } else { './gradlew' }
          $external = Join-Path $env:RUNNER_TEMP 'madre-external-sdk-consumer'
          if (Test-Path $external) { Remove-Item -Recurse -Force $external }
          New-Item -ItemType Directory -Force -Path $external | Out-Null
          Copy-Item 'verification/sdk-consumer/*' $external -Recurse -Force
          $repository = (Resolve-Path 'build/isolated-repository').Path
          & $gradle --no-daemon --build-cache -p $external "-PmadreRepository=$repository" clean jar
          if ($LASTEXITCODE -ne 0) { throw 'external Module test/package build failed' }
          $jar = Join-Path $external 'build/libs/independent-module.jar'
          if (-not (Test-Path $jar)) { throw 'external Module JAR was not produced' }
          "EXTERNAL_MODULE_JAR=$jar" >> $env:GITHUB_ENV

      - name: Install external JAR in normal owner Module directory and invoke it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appImage = (Resolve-Path 'madre-app/build/jpackage/app-image/madre').Path
          $launcher = if ($IsWindows) {
            Join-Path $appImage 'madre.exe'
          } else {
            Join-Path $appImage 'bin/madre'
          }
          if (-not (Test-Path $launcher)) { throw "packaged launcher is missing: $launcher" }

          $temp = Join-Path $env:RUNNER_TEMP 'madre-sdk-owner-home'
          if (Test-Path $temp) { Remove-Item -Recurse -Force $temp }
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          $saved = @{
            HOME = $env:HOME
            APPDATA = $env:APPDATA
            LOCALAPPDATA = $env:LOCALAPPDATA
            XDG_CONFIG_HOME = $env:XDG_CONFIG_HOME
            XDG_DATA_HOME = $env:XDG_DATA_HOME
            XDG_STATE_HOME = $env:XDG_STATE_HOME
          }
          try {
            $env:HOME = Join-Path $temp 'home'
            New-Item -ItemType Directory -Force -Path $env:HOME | Out-Null
            if ($IsWindows) {
              $env:APPDATA = Join-Path $temp 'roaming'
              $env:LOCALAPPDATA = Join-Path $temp 'local'
              $dataDirectory = Join-Path $env:LOCALAPPDATA 'MADRE'
            } else {
              $env:XDG_CONFIG_HOME = Join-Path $temp 'config'
              $env:XDG_DATA_HOME = Join-Path $temp 'data'
              $env:XDG_STATE_HOME = Join-Path $temp 'state'
              $dataDirectory = Join-Path $env:XDG_DATA_HOME 'madre'
            }

            $bootstrap = (& $launcher doctor 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { Write-Host $bootstrap; throw 'packaged host bootstrap failed' }
            Write-Host $bootstrap
            $ownerModules = Join-Path $dataDirectory 'modules'
            if (-not (Test-Path $ownerModules)) {
              throw "packaged host did not create owner Module directory: $ownerModules"
            }
            Copy-Item $env:EXTERNAL_MODULE_JAR (Join-Path $ownerModules 'independent-module.jar') -Force

            $doctor = (& $launcher doctor 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { Write-Host $doctor; throw 'doctor failed after owner Module installation' }
            Write-Host $doctor
            if ($doctor -notmatch 'module\s+phd\.module') {
              throw 'packaged MADRE did not discover the independently built owner Module'
            }

            $owner = (& $launcher --invoke-owner phd.module inspect request S4 hello 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { Write-Host $owner; throw 'owner-local external Module invocation failed' }
            Write-Host $owner
            if ($owner -notmatch 'S4\s+private:hello') {
              throw 'owner-local invocation did not preserve Module-created sensitive Material'
            }

            $public = (& $launcher --invoke-public phd.module inspect request S4 hello 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { Write-Host $public; throw 'PUBLIC external Module invocation failed' }
            Write-Host $public
            if ($public -notmatch 'public:hello') {
              throw 'PUBLIC invocation did not return semantic public transformation'
            }
            if ($public -match 'private:hello') {
              throw 'raw Module Material crossed the external PUBLIC receiver boundary'
            }
          } finally {
            foreach ($name in $saved.Keys) {
              [Environment]::SetEnvironmentVariable($name, $saved[$name], 'Process')
            }
            Remove-Item -Recurse -Force $temp -ErrorAction SilentlyContinue
          }
