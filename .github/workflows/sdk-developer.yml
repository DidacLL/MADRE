name: Extended SDK developer acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-developer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-module:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Publish public artifacts and build developer installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\\gradlew.bat' } else { './gradlew' }
          & $gradle --no-daemon --build-cache publish :madre-app:installDist
          if ($LASTEXITCODE -ne 0) { throw 'MADRE publication or developer installation failed' }

      - name: Build SDK consumer outside the MADRE checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\\gradlew.bat' } else { './gradlew' }
          $external = Join-Path $env:RUNNER_TEMP 'madre-external-sdk-consumer'
          if (Test-Path $external) { Remove-Item -Recurse -Force $external }
          New-Item -ItemType Directory -Force -Path $external | Out-Null
          Copy-Item 'verification/sdk-consumer/*' $external -Recurse -Force
          $repository = (Resolve-Path 'build/isolated-repository').Path
          & $gradle --no-daemon --build-cache -p $external "-PmadreRepository=$repository" clean test jar
          if ($LASTEXITCODE -ne 0) { throw 'external Module build/test failed' }
          $jar = Join-Path $external 'build/libs/independent-module.jar'
          if (-not (Test-Path $jar)) { throw 'external Module JAR was not produced' }
          "EXTERNAL_MODULE_JAR=$jar" >> $env:GITHUB_ENV

      - name: Build independent reasoning fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\\gradlew.bat' } else { './gradlew' }
          & $gradle --no-daemon --build-cache -p verification/reasoning-consumer jar
          if ($LASTEXITCODE -ne 0) { throw 'independent reasoning provider build failed' }

      - name: Prove installed owner lifecycle and semantic boundaries
        shell: pwsh
        run: |
          $target = 'verification/sdk-consumer/build/libs/independent-module.jar'
          New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
          Copy-Item $env:EXTERNAL_MODULE_JAR $target -Force
          ./verification/installed-owner-acceptance.ps1

      - name: Prove manual-placement compatibility is non-destructive
        shell: pwsh
        run: |
          ./verification/manual-artifact-protection-acceptance.ps1 `
            -AppRoot 'madre-app/build/install/madre' `
            -ModuleJar $env:EXTERNAL_MODULE_JAR `
            -ReasoningJar 'verification/reasoning-consumer/build/libs/independent-reasoning.jar'
