name: Extended SDK developer acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sdk-developer.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'madre-algebra/**'
      - 'madre-bom/**'
      - 'madre-sdk/**'
      - 'madre-sdk-testkit/**'
      - 'madre-sdk-experimental/**'
      - 'madre-reasoning-spi/**'
      - 'madre-text-inference/**'
      - 'madre-text-generation/**'
      - 'madre-embeddings/**'
      - 'madre-kernel/**'
      - 'madre-module-owner-interaction/**'
      - 'madre-app/**'
      - 'verification/sdk-consumer/**'
      - 'verification/reasoning-consumer/**'
      - 'verification/r4-workspace-module/**'
      - 'verification/installed-owner-acceptance.ps1'
      - 'verification/r4-core-composition-acceptance.ps1'

permissions:
  contents: read

concurrency:
  group: sdk-developer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  external-module:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build owner release image with public development contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\gradlew.bat' } else { './gradlew' }
          & $gradle --no-daemon --build-cache :madre-app:jpackageAppImage
          if ($LASTEXITCODE -ne 0) { throw 'MADRE owner release image build failed' }

      - name: Build independent extensions from the packaged development surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $externalRoot = Join-Path $env:RUNNER_TEMP 'madre-source-independent-developer'
          $v1 = Join-Path $externalRoot 'module-v1'
          $v2 = Join-Path $externalRoot 'module-v2'
          $reasoning = Join-Path $externalRoot 'reasoning'
          $r4v1 = Join-Path $externalRoot 'r4-workspace-v1'
          $r4v2 = Join-Path $externalRoot 'r4-workspace-v2'
          $releaseDeveloper = Join-Path $externalRoot 'release-developer'
          if (Test-Path $externalRoot) { Remove-Item -Recurse -Force $externalRoot }
          New-Item -ItemType Directory -Force -Path $v1, $v2, $reasoning, $r4v1, $r4v2, $releaseDeveloper | Out-Null

          $appImage = (Resolve-Path 'madre-app/build/jpackage/app-image/madre').Path
          $appDirectory = if ($IsWindows) { Join-Path $appImage 'app' } else { Join-Path $appImage 'lib/app' }
          $packagedDeveloper = Join-Path $appDirectory 'developer'
          $packagedRepository = Join-Path $packagedDeveloper 'repository'
          $packagedGuide = Join-Path $packagedDeveloper 'README.md'
          if (-not (Test-Path $packagedRepository)) {
              throw 'owner release image is missing developer/repository'
          }
          if (-not (Test-Path $packagedGuide)) {
              throw 'owner release image is missing the packaged SDK developer guide'
          }

          $expectedArtifacts = @(
              'madre-algebra', 'madre-bom', 'madre-embeddings', 'madre-reasoning-spi',
              'madre-sdk', 'madre-sdk-experimental', 'madre-sdk-testkit',
              'madre-text-generation', 'madre-text-inference'
          ) | Sort-Object
          $groupRoot = Join-Path $packagedRepository 'io/github/didacll'
          $actualArtifacts = @(Get-ChildItem $groupRoot -Directory | Select-Object -ExpandProperty Name | Sort-Object)
          if (($actualArtifacts -join ',') -ne ($expectedArtifacts -join ',')) {
              throw "packaged public development boundary mismatch: $($actualArtifacts -join ',')"
          }

          # Shipped CORE and runtime were already compiled above. Enforce that their production
          # sources contain none of the proving Module's exact identities before the external build.
          $productionRoots = @('madre-module-owner-interaction/src/main', 'madre-kernel/src/main', 'madre-app/src/main')
          $production = @(Get-ChildItem $productionRoots -Recurse -File -Filter '*.java')
          foreach ($targetFact in @('verification.workspace', 'record-note', 'summarize-notes',
                  'workspace-command', 'workspace-result')) {
              if ($production | Select-String -SimpleMatch $targetFact) {
                  throw "shipped production code hard-codes R4 proving Module fact: $targetFact"
              }
          }

          # Simulate acquisition from a released/installed MADRE: copy only the product-carried
          # developer surface to a source-free workspace, then remove the checkout-local publication
          # repository so external builds cannot accidentally consume source-build output.
          Copy-Item (Join-Path $packagedDeveloper '*') $releaseDeveloper -Recurse -Force
          $repository = (Resolve-Path (Join-Path $releaseDeveloper 'repository')).Path
          if (Test-Path 'build/isolated-repository') {
              Remove-Item 'build/isolated-repository' -Recurse -Force
          }

          Copy-Item 'verification/sdk-consumer/*' $v1 -Recurse -Force
          Copy-Item 'verification/sdk-consumer/*' $v2 -Recurse -Force
          Copy-Item 'verification/reasoning-consumer/*' $reasoning -Recurse -Force
          Copy-Item 'verification/r4-workspace-module/*' $r4v1 -Recurse -Force
          Copy-Item 'verification/r4-workspace-module/*' $r4v2 -Recurse -Force

          & gradle --no-daemon --build-cache -p $v1 "-PmadreRepository=$repository" `
              '-PartifactBehavior=v1' clean check jar
          if ($LASTEXITCODE -ne 0) { throw 'external Module v1 build/test failed' }
          & gradle --no-daemon --build-cache -p $v2 "-PmadreRepository=$repository" `
              '-PartifactBehavior=v2' clean check jar
          if ($LASTEXITCODE -ne 0) { throw 'external Module v2 build/test failed' }
          & gradle --no-daemon --build-cache -p $reasoning "-PmadreRepository=$repository" `
              clean check jar
          if ($LASTEXITCODE -ne 0) { throw 'external reasoning provider build/check failed' }
          & gradle --no-daemon --build-cache -p $r4v1 "-PmadreRepository=$repository" `
              '-PartifactBehavior=v1' clean check jar
          if ($LASTEXITCODE -ne 0) { throw 'R4 independent Module v1 build/check failed' }
          & gradle --no-daemon --build-cache -p $r4v2 "-PmadreRepository=$repository" `
              '-PartifactBehavior=v2' clean check jar
          if ($LASTEXITCODE -ne 0) { throw 'R4 independent Module v2 build/check failed' }

          $v1Jar = Join-Path $v1 'build/libs/independent-module.jar'
          $v2Jar = Join-Path $v2 'build/libs/independent-module.jar'
          $reasoningJar = Join-Path $reasoning 'build/libs/independent-reasoning.jar'
          $r4v1Jar = Join-Path $r4v1 'build/libs/r4-workspace-module.jar'
          $r4v2Jar = Join-Path $r4v2 'build/libs/r4-workspace-module.jar'
          if (-not (Test-Path $v1Jar) -or -not (Test-Path $v2Jar) -or
                  -not (Test-Path $reasoningJar) -or -not (Test-Path $r4v1Jar) -or
                  -not (Test-Path $r4v2Jar)) {
              throw 'external extension JARs were not produced'
          }
          if ((Get-FileHash $v1Jar -Algorithm SHA256).Hash -eq
                  (Get-FileHash $v2Jar -Algorithm SHA256).Hash) {
              throw 'external Module builds did not produce changed artifacts'
          }
          if ((Get-FileHash $r4v1Jar -Algorithm SHA256).Hash -eq
                  (Get-FileHash $r4v2Jar -Algorithm SHA256).Hash) {
              throw 'R4 replacement builds did not produce changed artifacts'
          }
          "EXTERNAL_MODULE_V1_JAR=$v1Jar" >> $env:GITHUB_ENV
          "EXTERNAL_MODULE_V2_JAR=$v2Jar" >> $env:GITHUB_ENV
          "EXTERNAL_REASONING_JAR=$reasoningJar" >> $env:GITHUB_ENV
          "R4_MODULE_V1_JAR=$r4v1Jar" >> $env:GITHUB_ENV
          "R4_MODULE_V2_JAR=$r4v2Jar" >> $env:GITHUB_ENV

      - name: Prove installed extension lifecycle and semantic boundaries
        shell: pwsh
        run: |
          ./verification/installed-owner-acceptance.ps1 `
            -AppImageRoot 'madre-app/build/jpackage/app-image/madre' `
            -ModuleJar $env:EXTERNAL_MODULE_V1_JAR `
            -ReplacementModuleJar $env:EXTERNAL_MODULE_V2_JAR `
            -ReasoningJar $env:EXTERNAL_REASONING_JAR

      - name: Prove CORE composition of an independently built unknown Module
        shell: pwsh
        run: |
          ./verification/r4-core-composition-acceptance.ps1 `
            -AppImageRoot 'madre-app/build/jpackage/app-image/madre' `
            -ModuleJar $env:R4_MODULE_V1_JAR `
            -ReplacementModuleJar $env:R4_MODULE_V2_JAR
