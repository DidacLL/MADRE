name: Extended SDK developer acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-developer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-module:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Publish public verification artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\\gradlew.bat' } else { './gradlew' }
          & $gradle --no-daemon --build-cache publish
          if ($LASTEXITCODE -ne 0) { throw 'MADRE verification publication failed' }

      - name: Build SDK consumer outside the MADRE checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = if ($IsWindows) { '.\\gradlew.bat' } else { './gradlew' }
          $external = Join-Path $env:RUNNER_TEMP 'madre-external-sdk-consumer'
          if (Test-Path $external) { Remove-Item -Recurse -Force $external }
          New-Item -ItemType Directory -Force -Path $external | Out-Null
          Copy-Item 'verification/sdk-consumer/*' $external -Recurse -Force
          $repository = (Resolve-Path 'build/isolated-repository').Path
          & $gradle --no-daemon --build-cache -p $external "-PmadreRepository=$repository" clean test jar
          if ($LASTEXITCODE -ne 0) { throw 'external Module build/test failed' }
          if (-not (Test-Path (Join-Path $external 'build/libs/independent-module.jar'))) {
            throw 'external Module JAR was not produced'
          }
