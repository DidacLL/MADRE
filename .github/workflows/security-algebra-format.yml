name: security-algebra-format

on:
  pull_request:
    branches:
      - architecture/modular-agentic-clean-slate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'implementation/final-security-algebra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/final-security-algebra
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv sync --locked
      - run: uv run --locked ruff check --fix .
      - run: uv run --locked ruff format .
      - name: Commit mechanical formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply pinned Ruff formatting"
          git push origin HEAD:implementation/final-security-algebra
