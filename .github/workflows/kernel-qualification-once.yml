name: MADRE Kernel Urgency Race Repair

on:
  push:
    branches:
      - agentic/kernel-qualification-execution

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verification branch head
        uses: actions/checkout@v4
        with:
          ref: agentic/kernel-physical-verification
          fetch-depth: 0
      - name: Confirm expected starting SHA
        run: test "$(git rev-parse HEAD)" = "21f657307fe10b8007831281e59b6c0fb173ab54"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Repair stale ready-set slot handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('kernel/src/Madre.Kernel/KernelEngine.cs')
          text = path.read_text()
          replacements = {
              '''            while (!cancellationToken.IsCancellationRequested)\n            {\n                DateTimeOffset now = _clock.UtcNow;''': '''            while (!cancellationToken.IsCancellationRequested)\n            {\n                int dispatchBudget = _slots.CurrentCount;\n                DateTimeOffset now = _clock.UtcNow;''',
              '''                    if (_slots.CurrentCount > 0)\n                    {\n                        await ScheduleAsync(work, decision.Capability!, cancellationToken).ConfigureAwait(false);\n                    }''': '''                    if (dispatchBudget > 0\n                        && await ScheduleAsync(work, decision.Capability!, cancellationToken).ConfigureAwait(false))\n                    {\n                        dispatchBudget--;\n                    }''',
              '''    private async Task ScheduleAsync(\n        SchedulingWork work,''': '''    private async Task<bool> ScheduleAsync(\n        SchedulingWork work,''',
              '''        if (!_slots.Wait(0))\n        {\n            return;\n        }''': '''        if (!_slots.Wait(0))\n        {\n            return false;\n        }''',
              '''            if (claimed is null)\n            {\n                _slots.Release();\n                return;\n            }''': '''            if (claimed is null)\n            {\n                _slots.Release();\n                return false;\n            }''',
              '''            if (task.IsCompleted)\n            {\n                _runningTasks.TryRemove(work.WorkId, out _);\n            }\n        }\n        finally''': '''            if (task.IsCompleted)\n            {\n                _runningTasks.TryRemove(work.WorkId, out _);\n            }\n            return true;\n        }\n        finally''',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          git diff -- kernel/src/Madre.Kernel/KernelEngine.cs
      - name: Build Kernel verification after repair
        run: dotnet build tests/Madre.Kernel.Verification/Madre.Kernel.Verification.csproj --configuration Release
      - name: Commit and push urgency repair
        run: |
          git config user.name 'MADRE orchestrator'
          git config user.email '107514286+DidacLL@users.noreply.github.com'
          git add kernel/src/Madre.Kernel/KernelEngine.cs
          git commit -m 'Preserve urgency across slot release races'
          git push origin HEAD:agentic/kernel-physical-verification
          git rev-parse HEAD
