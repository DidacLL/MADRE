name: MADRE Kernel One-Off Verifier Repair

on:
  push:
    branches:
      - agentic/kernel-qualification-execution

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: agentic/kernel-physical-verification
          fetch-depth: 0
      - name: Confirm expected starting SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "3454187841dc285ac6c9a887dbc23c053d3038f3"
      - name: Apply exact verifier compile correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/Madre.Kernel.Verification/RegressionVerification.cs')
          text = path.read_text()
          old = '''        Task[] readers = Enumerable.Range(0, 64)\n            .Select(async _ =>\n            {\n                _ = await engine.InspectAsync(observed).ConfigureAwait(false);\n                _ = await engine.ResultAsync(observed).ConfigureAwait(false);\n            })\n'''
          new = '''        Task[] readers = Enumerable.Range(0, 64)\n            .Select(async _unused =>\n            {\n                _ = await engine.InspectAsync(observed).ConfigureAwait(false);\n                _ = await engine.ResultAsync(observed).ConfigureAwait(false);\n            })\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one compile-defect block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- tests/Madre.Kernel.Verification/RegressionVerification.cs
      - name: Commit and push bounded correction
        shell: bash
        run: |
          git config user.name 'MADRE orchestrator'
          git config user.email '107514286+DidacLL@users.noreply.github.com'
          git add tests/Madre.Kernel.Verification/RegressionVerification.cs
          git commit -m 'Fix verifier reader discard compilation'
          git push origin HEAD:agentic/kernel-physical-verification
          git rev-parse HEAD
