name: MADRE Kernel Windows Qualification Diagnostic

on:
  push:
    branches:
      - agentic/kernel-qualification-execution

permissions:
  contents: read

jobs:
  qualify-windows:
    name: qualification / windows-latest
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Kernel verification candidate
        uses: actions/checkout@v4
        with:
          ref: d94b180ab123a7b030005966f92f9d476d0e11f6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Confirm exact tested SHA
        shell: pwsh
        run: if ((git rev-parse HEAD).Trim() -ne 'd94b180ab123a7b030005966f92f9d476d0e11f6') { throw 'wrong tested SHA' }
      - name: Build Java physical client and acceptance tooling
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean build
      - name: Build Kernel acceptance and verification
        shell: pwsh
        run: >-
          dotnet build tests/Madre.Kernel.Acceptance/Madre.Kernel.Acceptance.csproj
          --configuration Release;
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE };
          dotnet build tests/Madre.Kernel.Verification/Madre.Kernel.Verification.csproj
          --configuration Release;
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run preserved Lane C acceptance
        shell: pwsh
        run: dotnet run --project tests/Madre.Kernel.Acceptance/Madre.Kernel.Acceptance.csproj --configuration Release --no-build
      - name: Run bounded Windows qualification
        shell: pwsh
        run: >-
          dotnet run --project tests/Madre.Kernel.Verification/Madre.Kernel.Verification.csproj
          --configuration Release --no-build --
          --mode qualification
          --seed 12648430
          --scale medium
          --soak-seconds 60
