name: MADRE Kernel One-Off Verifier Repair

on:
  push:
    branches:
      - agentic/kernel-qualification-execution

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: agentic/kernel-physical-verification
          fetch-depth: 0
      - name: Confirm expected starting SHA
        run: test "$(git rev-parse HEAD)" = "eb257da4d80f348c72f5644bb55807893ddc5ddd"
      - name: Fetch one-off repair script
        run: git show origin/agentic/kernel-qualification-execution:tools/kernel-verifier-repair.py > /tmp/kernel-verifier-repair.py
      - name: Apply bounded corrections
        run: |
          python3 /tmp/kernel-verifier-repair.py
          git diff --check
          git diff --stat
      - name: Commit and push
        run: |
          git config user.name 'MADRE orchestrator'
          git config user.email '107514286+DidacLL@users.noreply.github.com'
          git add tests/Madre.Kernel.Verification/AdditionalVerification.cs tests/Madre.Kernel.Verification/IntegrationVerification.cs madre-kernel-client/src/test/java/io/github/didacll/madre/kernel/client/KernelClientProcess.java
          git commit -m 'Make urgency and Java Unicode verification deterministic'
          git push origin HEAD:agentic/kernel-physical-verification
          git rev-parse HEAD
