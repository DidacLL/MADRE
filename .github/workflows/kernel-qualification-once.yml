name: MADRE Kernel Verifier Fixture Repair

on:
  push:
    branches:
      - agentic/kernel-qualification-execution

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verification branch head
        uses: actions/checkout@v4
        with:
          ref: agentic/kernel-physical-verification
          fetch-depth: 0
      - name: Confirm expected starting SHA
        run: test "$(git rev-parse HEAD)" = "41771241a968ff1cfa6d2cfc9bba9e104f5f6985"
      - name: Make urgency fixture cancellation-aware
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/Madre.Kernel.Verification/AdditionalVerification.cs')
          text = path.read_text()
          replacements = {
              'ExecuteHandler = (request, _) => request.PreparedInput switch': 'ExecuteHandler = (request, cancellationToken) => request.PreparedInput switch',
              '"blocker" => SignalAndWait(blockerStarted, blockerRelease),': '"blocker" => SignalAndWait(blockerStarted, blockerRelease, cancellationToken),',
              '"interactive" => SignalAndWait(candidateStarted, interactiveRelease),': '"interactive" => SignalAndWait(candidateStarted, interactiveRelease, cancellationToken),',
              '"normal" => SignalAndWait(candidateStarted, normalRelease),': '"normal" => SignalAndWait(candidateStarted, normalRelease, cancellationToken),',
              '"background" => SignalAndWait(candidateStarted, backgroundRelease),': '"background" => SignalAndWait(candidateStarted, backgroundRelease, cancellationToken),',
              '''    private static Task<BindingExecutionResult> SignalAndWait(\n        TaskCompletionSource<bool> started,\n        TaskCompletionSource<BindingExecutionResult> release)\n    {\n        started.TrySetResult(true);\n        return release.Task;\n    }''': '''    private static Task<BindingExecutionResult> SignalAndWait(\n        TaskCompletionSource<bool> started,\n        TaskCompletionSource<BindingExecutionResult> release,\n        CancellationToken cancellationToken)\n    {\n        started.TrySetResult(true);\n        return release.Task.WaitAsync(cancellationToken);\n    }''',
              '''    private static Task<BindingExecutionResult> SignalAndWait(\n        SemaphoreSlim started,\n        TaskCompletionSource<BindingExecutionResult> release)\n    {\n        started.Release();\n        return release.Task;\n    }''': '''    private static Task<BindingExecutionResult> SignalAndWait(\n        SemaphoreSlim started,\n        TaskCompletionSource<BindingExecutionResult> release,\n        CancellationToken cancellationToken)\n    {\n        started.Release();\n        return release.Task.WaitAsync(cancellationToken);\n    }''',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          git diff -- tests/Madre.Kernel.Verification/AdditionalVerification.cs
      - name: Commit and push fixture repair
        run: |
          git config user.name 'MADRE orchestrator'
          git config user.email '107514286+DidacLL@users.noreply.github.com'
          git add tests/Madre.Kernel.Verification/AdditionalVerification.cs
          git commit -m 'Make urgency verifier cancellation-aware'
          git push origin HEAD:agentic/kernel-physical-verification
          git rev-parse HEAD
