name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  repository-policy:
    name: Repository policy check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check stale blocker phrases
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files 'AGENTS.md' 'agents/**/*.md' 'devboard/**/*.html')"
          if [ -z "$files" ]; then
            echo "No agent-facing Markdown or dashboard HTML files found."
            exit 0
          fi

          pattern='pending human review|under review|under correction|not yet implementation-enabling|blocked until human|needs human review|pending acceptance|awaiting acceptance|human must review'
          if printf '%s\n' "$files" | xargs grep -nEi "$pattern"; then
            echo "Forbidden stale blocker phrase found in agent-facing Markdown/HTML."
            exit 1
          fi

      - name: Check forbidden generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files 'agents/def/runtime-slice*.md' 'agents/def/*report*.md' 'agents/def/*spec*.md' 'agents/def/*slice*.md' 'agents/def/*draft*.md' 'agents/def/*analysis*.md' 'agents/def/*review*.md')"
          if [ -n "$forbidden" ]; then
            echo "Generated task artifacts must not live under agents/def/**:"
            printf '%s\n' "$forbidden"
            exit 1
          fi

  markdown-sanity:
    name: Markdown and link sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "AGENTS.md"
            "agents/def/operating-contract.md"
            "agents/def/product-orientation.md"
            "docs/tex/MADRE-AgenticSystem.tex"
          )

          missing=0
          for path in "${required[@]}"; do
            if [ ! -f "$path" ]; then
              echo "Missing required file: $path"
              missing=1
            fi
          done
          exit "$missing"

  tex-compile:
    name: TeX compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect TeX changes
        id: tex_changes
        shell: bash
        run: |
          set -euo pipefail
          should_run="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_run="true"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -q '^docs/tex/'; then
              should_run="true"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^docs/tex/'; then
              should_run="true"
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Checkout P3CTeX
        if: steps.tex_changes.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: DidacLL/P3CTeX
          path: .deps/P3CTeX

      - name: Install TeX Live
        if: steps.tex_changes.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            lmodern

      - name: Compile canonical dossier
        if: steps.tex_changes.outputs.should_run == 'true'
        working-directory: docs/tex
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p auxfiles ../
          export TEXINPUTS="${GITHUB_WORKSPACE}/.deps/P3CTeX/tex/latex//:${GITHUB_WORKSPACE}/.deps/P3CTeX/tex/code//:${GITHUB_WORKSPACE}/docs/tex//:"
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=auxfiles MADRE-AgenticSystem.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=auxfiles MADRE-AgenticSystem.tex
          mv auxfiles/MADRE-AgenticSystem.pdf ../MADRE-AgenticSystem.pdf
