name: security-algebra-platform-validation

on:
  pull_request:
    branches:
      - architecture/modular-agentic-clean-slate

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'implementation/final-security-algebra'
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv build --python .venv --no-build-isolation
      - name: Install wheel over editable package
        shell: bash
        run: uv pip install --no-deps --reinstall dist/*.whl
      - name: Verify wheel outside checkout
        shell: bash
        run: |
          project_python="$(uv python find)"
          cd "$RUNNER_TEMP"
          "$project_python" -I -c "import madre, madre_core, madre_sdk; from pathlib import Path; assert all('site-packages' in Path(module.__file__).parts for module in (madre, madre_core, madre_sdk)); print(madre.__file__); print(madre_sdk.__file__); print(madre_core.__file__)"
